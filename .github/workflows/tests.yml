# Les tests du jeu sur les machines de GitHub, à chaque envoi (git push) sur n'importe quelle branche.
# Gratuit et sans limite : le dépôt est public. Le résultat se lit dans l'onglet « Actions » du dépôt.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:   # bouton « Run workflow » dans l'onglet Actions

# un nouvel envoi sur la même branche arrête le passage précédent, devenu inutile
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # chaque partie de tests/lancer.py dans un travail à elle, en parallèle (une « matrix ») : le passage dure le temps du plus long
  # travail, pas la somme ; ecrans.py est coupé en tranches (ECRANS_TRANCHE=k/n : une page sur n). Le passage n'est vert que si
  # tous les travaux le sont (fail-fast: false : un travail rouge n'arrête pas les autres, on voit tout ce qui casse).
  tests:
    name: ${{ matrix.nom }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nom: moteur, partie: moteur recoins, recoins: 'defi,stockage,manette,touches-deux' }   # (+ des parties de tests/recoins.py, réparties au tour 51m selon les durées du passage 42425442653 : chaque travail sous ~430 s, sauf stands.html seul, ~450 s, et saison.py seul, ~530 s ; voir CLAUDE.md, « Répartition de tests/recoins.py »)
          - { nom: courses, partie: courses recoins, recoins: 'tailles-jeux-1920,pendant' }
          - { nom: stands, partie: stands }   # (stands.html seul : ~440 s, le plus long des tests, on ne lui ajoute rien)
          - { nom: consignes, partie: consignes recoins, recoins: 'sauvegardes-racine,sauvegardes-recentes' }
          - { nom: officiels, partie: officiels recoins, recoins: 'fin' }
          - { nom: meteo, partie: meteo recoins, recoins: 'carrieres' }
          # (6 tranches depuis le 2026-11-05, tour 48c-2 : à 4, elles tournaient entre 500 et 597 s pour une limite de 600 s)
          - { nom: ecrans-1, partie: ecrans, tranche: 1/6 }   # (tour 51m : plus aucune partie de recoins.py dans les tranches ecrans, ~380 s chacune : leur durée varie beaucoup d'une machine à l'autre, ecrans-4 a fait 597 s pour 384 prévues sur le passage 42425442653)
          - { nom: ecrans-2, partie: ecrans, tranche: 2/6 }
          - { nom: ecrans-3, partie: ecrans, tranche: 3/6 }
          - { nom: ecrans-4, partie: ecrans, tranche: 4/6 }
          - { nom: ecrans-5, partie: ecrans, tranche: 5/6 }
          - { nom: ecrans-6, partie: ecrans, tranche: 6/6 }
          - { nom: annexes, partie: annexes recoins, recoins: 'saison-en' }   # (+ la saison entière en anglais, tests/recoins.py)
          - { nom: paquet, partie: paquet recoins, recoins: 'aides-pilotage,sauvegarde' }   # (+ les aides au pilotage et la solidité de la sauvegarde, tests/recoins.py)
          - { nom: saison, partie: saison }   # la carrière entière jouée par le robot (tests/saison.py, Codeur 4)
          - { nom: premier, partie: premier recoins, recoins: 'ecrans,tuto,divisions' }   # le premier lancement : clic → feux, médiane de 3 essais (tests/premier.py), puis des recoins courts (8 min au plus par travail, Codeur 4)
          - { nom: recoins-1, partie: recoins, recoins: 'tailles-carriere-1920,tailles-jeux-1280,deux' }   # les recoins que saison.py ne visite pas (tests/recoins.py, Codeur 4)
          - { nom: recoins-2, partie: recoins, recoins: 'tailles-carriere-1280,tournoi,dynastie' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Google Chrome est déjà installé sur les machines de GitHub (google-chrome) ;
      # ecrans.py le prend par channel='chrome', donc pas de navigateur à télécharger.
      # (Essayé le 2026-10-22 : avec Chrome 150 comme sur le Mac, le test de la carte calculée en fond
      # reste rouge ici ; les écarts viennent de la machine, pas seulement de la version. Voir CLAUDE.md, « Aller plus vite ».)
      - name: Playwright
        run: pip install playwright websockets   # (websockets : le serveur relais en ligne, tests/serveur.py)

      # le Mac du propriétaire est en français et les tests attendent les textes français : même langue ici
      # (sinon navigator.language = en-US et le jeu s'affiche en anglais)
      - name: La partie ${{ matrix.nom }}
        env:
          LANG: fr_FR.UTF-8
          LANGUAGE: fr
          ECRANS_TRANCHE: ${{ matrix.tranche }}
          RECOINS: ${{ matrix.recoins }}
        run: |
          google-chrome --version
          python3 tests/lancer.py ${{ matrix.partie }}

      # les captures de tests/ecrans.py (et des autres parties), à télécharger depuis la page du passage, même en cas d'échec
      - name: Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ matrix.nom }}
          path: tests/captures/
          if-no-files-found: ignore
