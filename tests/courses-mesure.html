<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>courses entre IA</title></head><body>
<pre id="res"></pre>
<script>window.__err=[];window.addEventListener('error',e=>__err.push(e.message+' @'+e.filename+':'+e.lineno));</script>
<script src="../donnees.js"></script><script src="../aleatoire.js"></script><script src="../circuits.js"></script><script src="../physique.js"></script><script src="../course.js"></script><script src="../ia.js"></script><script src="../simulation.js"></script><script src="../aileron.js"></script><script src="../pneus-donnees.js"></script><script src="../pneus.js"></script>
<script>
// MESURE TEMPORAIRE (tour 49c, Codeur 3 ; à retirer avant la fusion) : vainqueur ≠ poleman, dépassements, chocs, herbe sous plusieurs réglages
const Q=new URLSearchParams(location.search),LOT=Q.get('lot')||'1';const L=[];
const ecrire=etape=>{document.getElementById('res').textContent=`${etape?'EN COURS ('+etape+') ':''}RESULTAT 1/1\n`+L.join('\n');};
const circuits={test:CIRCUIT_TEST,technique:construireCircuit(CIRCUITS.technique)};
const chocsForts=r=>r.voitures.flatMap(x=>x.chocs).filter(c=>c>5).length/2,somme=(r,f)=>r.voitures.reduce((a,x)=>a+f(x),0);
const LOTS={'1':[['5 tours, forme 0, feux',5,15,{IA_FORME:0,SIMULATION_FEUX:1}],['5 tours, forme 0.05',5,15,{IA_FORME:0.05}],['5 tours, forme 0.05, feux',5,15,{IA_FORME:0.05,SIMULATION_FEUX:1}]],
  '2':[['5 tours, forme 0, profiter',5,15,{IA_FORME:0,IA_PROFITER_ERREUR:true}],['5 tours, forme 0.02, profiter',5,15,{IA_FORME:0.02,IA_PROFITER_ERREUR:true}],['5 tours, forme 0.02, feux, profiter',5,15,{IA_FORME:0.02,SIMULATION_FEUX:1,IA_PROFITER_ERREUR:true}]],
  '3':[['12 tours avec pneus, forme 0.05 (graines 1-15)',12,15,{IA_FORME:0.05}]]};
const avant={IA_FORME:REGLAGES.IA_FORME,SIMULATION_FEUX:REGLAGES.SIMULATION_FEUX,IA_PROFITER_ERREUR:REGLAGES.IA_PROFITER_ERREUR,PNEUS_ACTIFS:REGLAGES.PNEUS_ACTIFS};
for(const [nomE,tours,G,reg] of LOTS[LOT]){Object.assign(REGLAGES,avant,reg);const T={n:0,pasPole:0,dep:0,depPiste:0,chocs:0,herbe:0,barr:0,fini:true,places:{}};
  for(const nom of ['test','technique']) for(let g=1;g<=G;g++){const r=simulerCourse(circuits[nom],10,tours,g),V=r.voitures,pole=r.grille[0].numero;
    T.n++;T.pasPole+=r.final[0]!==pole;T.dep+=r.depassements.length;T.depPiste+=r.depassements.filter(d=>!d.stand).length;T.chocs+=chocsForts(r);T.herbe+=somme(r,x=>x.herbe);T.barr+=somme(r,x=>x.contactsBarriere+x.coupes);T.fini=T.fini&&V.every(x=>x.fini);
    const pg=r.grille.findIndex(x=>x.numero===r.final[0])+1;T.places[pg]=(T.places[pg]||0)+1;ecrire(nomE+' '+nom+' '+g);}
  L.push('  MESURE 49c, '+nomE+' : '+JSON.stringify(T));}
Object.assign(REGLAGES,avant);if(window.__err.length) L.push('ERREURS '+__err.join(' | '));ecrire();
</script></body></html>
