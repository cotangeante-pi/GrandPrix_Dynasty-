<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>courses entre IA</title></head><body>
<pre id="res"></pre>
<script>window.__err=[];window.addEventListener('error',e=>__err.push(e.message+' @'+e.filename+':'+e.lineno));</script>
<script src="../donnees.js"></script><script src="../aleatoire.js"></script><script src="../circuits.js"></script><script src="../physique.js"></script><script src="../course.js"></script><script src="../ia.js"></script><script src="../simulation.js"></script><script src="../aileron.js"></script><script src="../pneus-donnees.js"></script><script src="../pneus.js"></script>
<script>
// MESURE TEMPORAIRE (tour 50a, Codeur 1 ; à retirer avant la fusion) : l'attaque de la voiture de tête (IA_ATTAQUE_TETE).
// 30 courses de 5 tours (test + technique, graines 1-15), 10 IA ; « lent » : le poleman roule à cette part de son rythme (un plus rapide part derrière)
const Q=new URLSearchParams(location.search),LOT=Q.get('lot')||'1';const L=[];
const ecrire=etape=>{document.getElementById('res').textContent=`${etape?'EN COURS ('+etape+') ':''}RESULTAT 1/1\n`+L.join('\n');};
const circuits={test:CIRCUIT_TEST,technique:construireCircuit(CIRCUITS.technique)};
const LOTS={'1':[['tete 0, poleman 0.95',0.95,{IA_ATTAQUE_TETE:0}],['tete 3, poleman 0.95',0.95,{IA_ATTAQUE_TETE:3}]],
  '2':[['tete 0, forme 0.15',1,{IA_ATTAQUE_TETE:0,IA_FORME:0.15}],['tete 3, forme 0.15',1,{IA_ATTAQUE_TETE:3,IA_FORME:0.15}]]};
const avant={IA_ATTAQUE_TETE:REGLAGES.IA_ATTAQUE_TETE,IA_FORME:REGLAGES.IA_FORME};
window.onerror=(m,f,l)=>{L.push('ERREUR '+m+' @'+f+':'+l);ecrire();};
for(const [nomE,lent,reg] of LOTS[LOT]){Object.assign(REGLAGES,avant,reg);const T={n:0,pasPole:0,dep:0,chocs:0,herbe:0,barr:0,fini:true,places:{},reussies:0};
  for(const nom of ['test','technique']) for(let g=1;g<=15;g++){const e=creerCourseIA(circuits[nom],10,5,g),pole=e.pilotes.find(p=>p.numero===e.grille[0].numero);
    if(lent!==1) pole.pilote.rythme*=lent;
    const pasMax=Math.round(5*REGLAGES.SIMULATION_TEMPS_MAX/REGLAGES.PAS_PHYSIQUE);for(let k=0;k<pasMax&&e.arrives<10;k++)pasCourseIA(e,REGLAGES.PAS_PHYSIQUE);
    const fin=classementFinal(e).map(x=>e.pilotes[x.k].numero),P=e.pilotes;
    T.n++;T.pasPole+=fin[0]!==pole.numero;T.dep+=e.depassements.length;T.chocs+=P.flatMap(p=>p.v.chocs).filter(c=>c>5).length/2;T.herbe+=P.reduce((a,p)=>a+p.herbe,0);
    T.barr+=P.reduce((a,p)=>a+p.v.contactsBarriere,0);T.fini=T.fini&&P.every(p=>p.arrivee!==null);T.reussies+=P.reduce((a,p)=>a+p.pilote.reussies,0);
    const pg=e.grille.findIndex(x=>x.numero===fin[0])+1;T.places[pg]=(T.places[pg]||0)+1;ecrire(nomE+' '+nom+' '+g);}
  L.push('  MESURE 50a, '+nomE+' : '+JSON.stringify(T));}
Object.assign(REGLAGES,avant);if(window.__err.length) L.push('ERREURS '+__err.join(' | '));ecrire();
</script></body></html>
