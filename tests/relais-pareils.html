<script>
// (tour 57, tâche 3) le relais JS (RESEAU.creerRelais) rejoue le scénario de tests/relais-pareils.py : window.rejouer(scenario, code) -> les messages reçus par chaque client
window.rejouer = function (scenario) {
  const relais = RESEAU.creerRelais({ exigerCharge: true, grace: 0 });
  const clients = [];
  const recus = [];
  let code = null;
  for (const [i, msg] of scenario) {
    while (clients.length <= i) { const k = clients.length; recus.push([]); clients.push(relais.connecter(m => recus[k].push(JSON.parse(JSON.stringify(m))))); }
    const m = JSON.parse(JSON.stringify(msg));
    if (m.code === '$CODE') m.code = code;
    if (m.t === 'creer' || m.t === 'rejoindre' || m.t === 'quitter' || true) clients[i].recevoir(m);
    if (code === null) { const s = recus[i].find(x => x.t === 'salle'); if (s) code = s.code; }
    if (m.t === '$fermer') clients[i].fermer();
  }
  return { code, recus };
};
