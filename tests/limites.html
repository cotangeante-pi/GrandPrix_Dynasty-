<pre id="res"></pre>
<script src="../donnees.js"></script><script src="../textes.js"></script><script src="../aleatoire.js"></script><script src="../boucle.js"></script><script src="../circuits-officiels-a.js"></script><script src="../circuits-officiels-b.js"></script><script src="../circuits.js"></script><script src="../physique.js"></script><script src="../boite.js"></script><script src="../sensations.js"></script><script src="../manette.js"></script><script src="../son.js"></script><script src="../effets3d.js"></script><script src="../conseil.js"></script><script src="../qualite.js"></script><script src="../assistance.js"></script><script src="../mesure.js"></script><script src="../regie.js"></script><script src="../camera.js"></script><script src="../robot.js"></script><script src="../ia.js"></script><script src="../simulation.js"></script><script src="../depart.js"></script><script src="../course.js"></script><script src="../arrivee.js"></script><script src="../qualification.js"></script><script src="../sauvegarde.js"></script><script src="../championnat.js"></script><script src="../divisions.js"></script><script src="../decouverte.js"></script><script src="../pilote.js"></script><script src="../deux-joueurs.js"></script><script src="../tournoi.js"></script><script src="../casque.js"></script><script src="../decors-officiels.js"></script><script src="../decor-public.js"></script><script src="../photo.js"></script><script src="../cache-carte.js"></script><script src="../cache-carte-test.js"></script><script src="../journal.js"></script><script src="../argent.js"></script><script src="../garage.js"></script><script src="../aileron.js"></script><script src="../carte2d.js"></script><script src="../saisons.js"></script><script src="../sponsors.js"></script><script src="../fiche.js"></script><script src="../interview.js"></script><script src="../carriere.js"></script><script src="../pneus-donnees.js"></script><script src="../pneus.js"></script><script src="../meteo.js"></script><script src="../enregistreur-donnees.js"></script><script src="../enregistreur.js"></script><script src="../resume.js"></script><script src="../messages.js"></script><script src="../commentaire.js"></script><script src="../voix-sons.js"></script><script src="../fantome-pole.js"></script><script src="../foule.js"></script><script src="../decor.js"></script><script src="../stand3d.js"></script><script src="../fantome.js"></script><script src="../defi.js"></script><script src="../touches.js"></script><script src="../clavier.js"></script><script src="../principal.js"></script>
<script>
// (tour 56, T1) les limites de piste : le gain d'une sortie se mesure contre le BORD de la piste, un petit débordement est un avertissement,
// le 4e coûte PENALITE_COUPE, un vrai raccourci coûte PENALITE_COUPE tout de suite ; les valeurs d'avant redonnent le jeu d'avant
const L=[];let ok=0,ko=0;
function t(n,f){try{f();ok++;L.push('✔ '+n);}catch(e){ko++;L.push('✘ '+n+' — '+e.message);}}
const v=(c,m)=>{if(!c)throw new Error(m||'faux');};
const DT=REGLAGES.PAS_PHYSIQUE;REGLAGES.PNEUS_ACTIFS=false;
const AVANT={COUPE_MESURE_BORD:REGLAGES.COUPE_MESURE_BORD,SEUIL_COUPE_GRAVE:REGLAGES.SEUIL_COUPE_GRAVE,LIMITES_AVERTISSEMENTS:REGLAGES.LIMITES_AVERTISSEMENTS};
function reglages(o){Object.assign(REGLAGES,AVANT,o);}
const D_AVANT={COUPE_MESURE_BORD:false,LIMITES_AVERTISSEMENTS:0};   // le jeu d'avant
// une voiture menée à la main (sans physique) à la vitesse u, sur une ligne à l'écart d du milieu, de s0 à s1 (d : fonction de s)
function course(C,s0){const c=creerCourse(C,5),vo=creerVoiture(C,s0,0);c.etat='course';c.sAvant=vo.piste.s;c.xAvant=vo.x;c.zAvant=vo.z;c.etape=0;return {c,vo};}
function pas(C,c,vo,s,d,u){const i=Math.round(((s%C.longueur)+C.longueur)%C.longueur/C.pas)%C.nb;vo.x=C.x[i]+C.nx[i]*d;vo.z=C.z[i]+C.nz[i]*d;vo.u=u;vo.piste=positionSurPiste(C,vo.x,vo.z,vo.piste.indice);majCourse(c,vo,DT);}
// l'écart d(s) tenu pendant sec secondes à partir du milieu du morceau m, vitesse u ; revient ensuite au milieu
function balade(C,m,cote,dEcart,sec,u){const sg=cote*m.angles[0];const mid=(m.debut+m.fin)/2-u*sec/2;const {c,vo}=course(C,m.debut+(m.fin-m.debut)*0.25);let s=vo.piste.s;
  for(;s<mid;s+=u*DT)pas(C,c,vo,s,0,u);
  for(let k=0;k<Math.round(sec/DT);k++,s+=u*DT)pas(C,c,vo,s,sg*dEcart,u);
  for(let k=0;k<240;k++,s+=u*DT)pas(C,c,vo,s,0,u);
  return c;}
const longs=Object.keys(CIRCUITS).map(nom=>{const C=construireCircuit(CIRCUITS[nom]);return {nom,C,m:C.morceaux.filter(m=>m.type==='virage'&&m.fin-m.debut>120).sort((a,b)=>(b.fin-b.debut)-(a.fin-a.debut))[0]};}).filter(x=>x.m);
v(longs.length>=10,longs.length+' circuits');

t('mesure : à l’intérieur d’un long virage, 0,5 s dehors à 60 m/s ne coûte rien, 2 s et 4 s non plus : seulement un avertissement', ()=>{reglages({});
  for(const {nom,C,m} of longs)for(const sec of [0.5,2,4]){const c=balade(C,m,1,C.largeur/2+1.6,sec,60);v(c.penalites===0,nom+' '+sec+' s : '+c.penalites+' s de pénalité');
    v(c.limites===1&&c.coupeTour,nom+' '+sec+' s : '+c.limites+' avertissement');}});
t('mesure : le gain de l’intérieur d’un virage, contre le bord, reste petit (au plus SEUIL_COUPE_GRAVE ÷ 3) et contre le milieu atteignait le seuil d’avant', ()=>{reglages({});let maxB=-99,maxM=-99,qui='';
  for(const {nom,C,m} of longs){const sg=m.angles[0],{c,vo}=course(C,m.debut+(m.fin-m.debut)*0.25);let s=vo.piste.s;
    for(;s<m.debut+(m.fin-m.debut)*0.4;s+=28*DT)pas(C,c,vo,s,0,60);
    for(let k=0;k<Math.round(4/DT);k++,s+=60*DT){pas(C,c,vo,s,sg*(C.largeur/2+1.6),60);if(c.sortie){const gb=c.sortie.bord-c.sortie.roule,gm=c.progression-c.sortie.progression-c.sortie.roule;if(gb>maxB)maxB=gb;if(gm>maxM){maxM=gm;qui=nom;}}}}
  L.push('  (4 s à 60 m/s à l’intérieur : gain contre le bord au plus '+maxB.toFixed(2)+' m ; contre le milieu '+maxM.toFixed(2)+' m à '+qui+')');v(maxB<REGLAGES.SEUIL_COUPE_GRAVE/3,'bord '+maxB);v(maxM>maxB+1,'milieu '+maxM);});
t('réglages d’avant (COUPE_MESURE_BORD faux, LIMITES_AVERTISSEMENTS 0) : la même sortie coûte +5 s, comme avant (au moins un circuit), jamais d’avertissement', ()=>{reglages(D_AVANT);let pen=0;
  for(const {nom,C,m} of longs){const c=balade(C,m,1,C.largeur/2+1.6,4,60);v(c.limites===0&&c.derniereLimite===undefined,'avertissement');if(c.penalites>0)pen++;}
  L.push('  (jeu d’avant : '+pen+' circuits sur '+longs.length+' coûtent +5 s à 4 s dehors à l’intérieur)');v(pen>=3,pen+' circuits');reglages({});});
t('une chicane coupée tout droit : +5 s tout de suite, le tour ✂, pas d’avertissement (mesure du bord ET d’avant)', ()=>{const C=CIRCUIT_TEST,ch=C.morceaux.find(m=>m.type==='chicane');v(ch,'pas de chicane');
  for(const o of [{},D_AVANT]){reglages(o);const {c,vo}=course(C,ch.debut-60);vo.u=25;let n=0;
    while(vo.piste.s<ch.fin+40&&n++<120*30){appliquerCommandes(vo,{gaz:vo.u<25?1:0,frein:0,direction:0});pasVoiture(vo,C,DT);majCourse(c,vo,DT);}
    v(c.penalites===REGLAGES.PENALITE_COUPE&&c.coupeTour&&c.limites===0,JSON.stringify(o)+' : pénalités '+c.penalites+' avertissements '+c.limites);}reglages({});});
t('les chicanes de tous les circuits, coupées tout droit à 25 m/s : ce que coûtait la coupe (avant) et ce qu’elle coûte (mesure du bord) ; jamais de coupe d’avant qui devienne gratuite', ()=>{let n=0,perdues=[];
  const essai=(C,ch,o)=>{reglages(o);const {c,vo}=course(C,ch.debut-60);vo.u=25;let k=0,gb=-99,gm=-99;while(vo.piste.s<ch.fin+40&&k++<120*30){appliquerCommandes(vo,{gaz:vo.u<25?1:0,frein:0,direction:0});pasVoiture(vo,C,DT);majCourse(c,vo,DT);
    if(c.sortie){gb=Math.max(gb,c.sortie.bord-c.sortie.roule);gm=Math.max(gm,c.progression-c.sortie.progression-c.sortie.roule);}}reglages({});return {pen:c.penalites,av:c.limites,gb:+gb.toFixed(1),gm:+gm.toFixed(1)};};
  for(const nom of Object.keys(CIRCUITS)){const C=construireCircuit(CIRCUITS[nom]);for(const ch of C.morceaux.filter(m=>m.type==='chicane')){
    const a=essai(C,ch,D_AVANT),b=essai(C,ch,{});n++;L.push(`  (chicane ${nom} ${Math.round(ch.debut)} m : avant ${a.pen} s (gain milieu ${a.gm}) ; maintenant ${b.pen} s, ${b.av} avertissement (gain bord ${b.gb}))`);
    if(a.pen>0&&b.pen===0) perdues.push(nom+' '+Math.round(ch.debut));}}
  v(n>=8,n+' chicanes');v(perdues.length===0,'coupes devenues gratuites : '+perdues.join(', '));});
t('quatre débordements : 1/3, 2/3, 3/3 sans pénalité, le 4e = +5 s, puis le compte repart (puis 3 de plus sans pénalité)', ()=>{reglages({});const C=CIRCUIT_TEST,{c,vo}=course(C,300);let s=300;const sort=()=>{for(let k=0;k<60;k++,s+=20*DT)pas(C,c,vo,s,C.largeur/2+4,20);for(let k=0;k<60;k++,s+=20*DT)pas(C,c,vo,s,0,20);};
  const vus=[];for(let i=0;i<8;i++){sort();vus.push(c.limites+'/'+c.penalites);}
  v(vus.join(' ')==='1/0 2/0 3/0 0/5 1/5 2/5 3/5 0/10',vus.join(' '));});
t('LIMITES_AVERTISSEMENTS 0 : un débordement sans raccourci ne coûte rien et ne marque pas le tour (comme avant)', ()=>{reglages({LIMITES_AVERTISSEMENTS:0});const C=CIRCUIT_TEST,{c,vo}=course(C,300);let s=300;
  for(let k=0;k<60;k++,s+=20*DT)pas(C,c,vo,s,C.largeur/2+4,20);for(let k=0;k<60;k++,s+=20*DT)pas(C,c,vo,s,0,20);v(c.penalites===0&&!c.coupeTour&&c.limites===0);reglages({});});
t('un tour avec un avertissement n’est jamais le meilleur tour (comme un tour coupé)', ()=>{reglages({});const c=creerCourse(CIRCUIT_TEST,0);c.etat='course';c.etape=3;c.secteursTour=[20,20];c.temps=50;limitesDePiste(c);finirTour(c);v(c.meilleurTour===null&&c.tours[0].coupe);});
t('la voie des stands : jamais de limites ni de virage coupé (comme avant)', ()=>{reglages({});const C=construireCircuit(CIRCUITS.silverstoun||CIRCUITS.test);if(!C.stands)return;const {c,vo}=course(C,C.stands.entree+10);vo.dansStands=true;let s=vo.piste.s;
  for(let k=0;k<60;k++,s+=10*DT)pas(C,c,vo,s,C.largeur/2+5,10);v(c.limites===0&&c.penalites===0);});
t('textes : l’avertissement et le commentaire existent en fr et en anglais, avec {n} et {max}', ()=>{for(const l of ['fr','en']){v(/\{n\}/.test(TEXTES[l].limites)&&/\{max\}/.test(TEXTES[l].limites),l+' limites');
  v(Array.isArray(TEXTES[l].com_limites)&&TEXTES[l].com_limites.length>=3&&TEXTES[l].com_limites.every(x=>/\{qui\}/.test(x)&&/\{n\}/.test(x)),l+' com_limites');}v(REGLAGES.COMMENTAIRE_PRIORITES.limites>0);});
document.getElementById('res').textContent=`RESULTAT ${ok}/${ok+ko}\n`+L.join('\n');
</script></body></html>
