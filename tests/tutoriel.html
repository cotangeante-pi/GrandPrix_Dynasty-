<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>tests du tutoriel guidé</title></head><body>
<pre id="res"></pre>
<script>window.__err=[];window.addEventListener('error',e=>__err.push(e.message+' @'+e.filename+':'+e.lineno));</script>
<script src="../donnees.js"></script><script src="../textes.js"></script><script src="../aleatoire.js"></script><script src="../circuits-officiels-a.js"></script><script src="../circuits-officiels-b.js"></script><script src="../circuits.js"></script><script src="../sauvegarde.js"></script><script src="../physique.js"></script><script src="../robot.js"></script><script src="../sensations.js"></script><script src="../tutoriel.js"></script>
<script>
// Le tutoriel guidé (tutoriel.js, étape 11d, Codeur 4), en calcul pur : chaque leçon se réussit quand on fait ce qu'elle demande et
// échoue si l'on ne fait rien (ou mal) ; la mise en place ; l'enchaînement ; la sauvegarde (à la racine) ; les textes.
const L=[];let ok=0,ko=0;
function t(n,f){try{f();ok++;L.push('✔ '+n);}catch(e){ko++;L.push('✘ '+n+' — '+e.message);}}
const v=(c,m)=>{if(!c)throw new Error(m||'faux');};
REGLAGES.PNEU_DRIFT=true;   // (tour 48b) les tests de la 8e leçon sont écrits avec le pneu drift : rallumé ici ; « drift caché » l'éteint
const R=REGLAGES,C=CIRCUIT_TEST,IDS=['conduite','freinage','depart','depassement','stand','pluie','visite','drapeaux','vivante'];   // (tour 37j : la voiture vivante ; tour 55, T20 : « drapeaux » la précède)
const base=o=>Object.assign({ecran:'course',etat:'course',tours:0,temps:0,herbe:false,s:0,vitesse:30,depart:null,arrets:0,arretEnCours:false,penalitesStands:0,pneus:'slick',eau:0,devant:false,longueur:C.longueur},o||{});
// joue une suite de situations, dt par image ; renvoie le résultat
const jouer=(su,liste,dt=1/30)=>{let r='encours';for(const s of liste){r=TUTORIEL.pas(su,s,dt);if(r!=='encours')break;}return r;};
const pendant=(s,secondes,dt=1/30)=>Array.from({length:Math.round(secondes/dt)},()=>s);

t('les 9 leçons (les 7 de CLAUDE.md, puis les drapeaux, puis la voiture vivante), dans l’ordre, numérotées, chacune avec son adresse (les modes du jeu : course seule, contre une IA, championnat)', ()=>{
  v(JSON.stringify(TUTORIEL.LECONS.map(l=>l.id))===JSON.stringify(IDS));v(TUTORIEL.LECONS.every((l,i)=>l.numero===i+1&&/^(course|championnat)=/.test(l.adresse)));
  v(/meteo=averse/.test(TUTORIEL.PAR_ID.pluie.adresse)&&/ia=1&joueur=1/.test(TUTORIEL.PAR_ID.depassement.adresse));});
t('chaque leçon a son nom, son but et sa consigne en anglais et en français, différents, avec les mêmes {repères} ; les raisons d’échec aussi', ()=>{
  const cles=['tutoBouton','tutoTitre','tutoIntro','tutoCommencer','tutoRetour','tutoPasser','tutoRecommencer','tutoSuivante','tutoListe','tutoQuitter','tutoReussie','tutoRatee','tutoBravo'];
  for(const id of IDS){cles.push('tuto_'+id,'tuto_'+id+'_but');if(id!=='visite') cles.push('tuto_'+id+'_consigne');}
  cles.push('tuto_drapeaux_consigne_aileron');
  for(const e of ['paddock','garage','aileron','retour','fin']) cles.push('tuto_visite_'+e);
  for(const r of ['sortie','temps','attente','patinage','cale','faux','essais','pasDevant','vitesse','pasArret','pneus','pasGlisse','teteAQueue','drapeau','pasPasse','pasRepare']) cles.push('tuto_raison_'+r);
  const rep=x=>(x.match(/\{\w+\}/g)||[]).sort().join();
  for(const k of cles){const en=TEXTES.en[k],fr=TEXTES.fr[k];v(typeof en==='string'&&typeof fr==='string'&&en&&fr&&en!==fr,k);v(rep(en)===rep(fr),k+' : repères');}});
t('les textes du tutoriel ne sont jamais genrés sur le joueur (fr : ni prêt·e, seul·e, il, elle… ; en : ni he, she…)', ()=>{
  const fr=/(^|[^\wàâçéèêëîïôûù])(prêt|prête|seul|seule|il|elle|lui-même|content|contente|heureux|heureuse|doué|douée|fort|forte|premier|première|parti|partie|arrivé|arrivée|sorti|sortie de piste !)(?![\wàâçéèêëîïôûù])/i, en=/\b(he|she|his|her|him)\b/i;
  for(const k of Object.keys(TEXTES.fr).filter(k=>/^tuto/.test(k))){v(!fr.test(TEXTES.fr[k]),'fr '+k+' : '+TEXTES.fr[k]);v(!en.test(TEXTES.en[k]),'en '+k);}});

// --- 1. accélérer, tourner, freiner
t('1. un tour sans sortir : réussie ; une sortie de piste en course : ratée (« sortie ») ; ne rien faire : ratée après TUTO_TEMPS_MAX s', ()=>{
  v(jouer(TUTORIEL.creerSuivi('conduite',C),[...pendant(base(),50),base({etat:'finie',tours:1})])==='reussie');
  const su=TUTORIEL.creerSuivi('conduite',C);v(jouer(su,[...pendant(base(),10),base({herbe:true})])==='ratee'&&su.raison==='sortie');
  const r=TUTORIEL.creerSuivi('conduite',C);v(jouer(r,pendant(base({etat:'compte',vitesse:0}),R.TUTO_TEMPS_MAX+1))==='ratee'&&r.raison==='temps',r.raison);
  const h=TUTORIEL.creerSuivi('conduite',C);v(jouer(h,[base({etat:'compte',herbe:true}),...pendant(base(),5)])==='encours','l’herbe avant le départ ne compte pas');});
t('une leçon finie ne change plus (réussie reste réussie)', ()=>{const su=TUTORIEL.creerSuivi('conduite',C);jouer(su,[base({etat:'finie'})]);v(TUTORIEL.pas(su,base({herbe:true}),1)==='reussie');});

// --- 2. la trajectoire et le point de freinage
const Z=TUTORIEL.zoneFreinage(C);
// un passage dans la zone à vitesse constante (m/s) : des situations le long de la piste, de 60 m avant les plots à 40 m après la fin
function passage(vitesse,herbe,dt=1/30){const lz=((Z.fin-Z.debut)%C.longueur+C.longueur)%C.longueur,liste=[];
  for(let x=-60;x<=lz+40;x+=vitesse*dt) liste.push(base({s:((Z.debut+x)%C.longueur+C.longueur)%C.longueur,herbe:!!(herbe&&x>10&&x<30)}));return liste;}
t('la zone du freinage entoure le virage le plus serré du circuit test : TUTO_ZONE_AVANT m avant lui, TUTO_ZONE_APRES m après', ()=>{
  v(Z&&Z.virage,'pas de zone');let k=0,ou=0;for(let i=0;i<C.nb;i++) if(Math.abs(C.courbure[i])>k){k=Math.abs(C.courbure[i]);ou=C.s[i];}
  v(ou>=Z.virage[0]&&ou<=Z.virage[1],'le plus serré à '+ou.toFixed(0)+' m, zone '+JSON.stringify(Z));
  v(Math.abs(((Z.virage[0]-Z.debut)%C.longueur+C.longueur)%C.longueur-R.TUTO_ZONE_AVANT)<1e-6&&Math.abs(((Z.fin-Z.virage[1])%C.longueur+C.longueur)%C.longueur-R.TUTO_ZONE_APRES)<1e-6);
  L.push('  (leçon 2 : la zone du freinage va de '+Z.debut.toFixed(0)+' à '+Z.fin.toFixed(0)+' m, le virage de '+Z.virage[0].toFixed(0)+' à '+Z.virage[1].toFixed(0)+' m)');});
t('2. un passage propre sous TUTO_ZONE_OBJECTIF : réussie ; trop lent TUTO_ZONE_ESSAIS fois : ratée (« essais ») avec le meilleur temps ; une sortie dans la zone ne compte pas', ()=>{
  const lz=((Z.fin-Z.debut)%C.longueur+C.longueur)%C.longueur,vite=lz/(R.TUTO_ZONE_OBJECTIF*0.8),lent=lz/(R.TUTO_ZONE_OBJECTIF*1.3);
  let su=TUTORIEL.creerSuivi('freinage',C);v(jouer(su,passage(vite))==='reussie'&&su.meilleur<=R.TUTO_ZONE_OBJECTIF,JSON.stringify([su.resultat,su.meilleur]));
  su=TUTORIEL.creerSuivi('freinage',C);let r='encours';for(let i=0;i<R.TUTO_ZONE_ESSAIS;i++) r=jouer(su,passage(lent));
  v(r==='ratee'&&su.raison==='essais'&&su.essais===R.TUTO_ZONE_ESSAIS&&Math.abs(su.meilleur-R.TUTO_ZONE_OBJECTIF*1.3)<0.2,JSON.stringify([r,su.raison,su.essais,su.meilleur]));
  su=TUTORIEL.creerSuivi('freinage',C);v(jouer(su,passage(vite,true))==='encours'&&su.essais===1&&su.meilleur===null&&!su.dernier.propre,'sortie comptée propre');
  su=TUTORIEL.creerSuivi('freinage',C);v(jouer(su,pendant(base({s:Z.debut-200,vitesse:0}),R.TUTO_TEMPS_MAX+1))==='ratee'&&su.raison==='temps','ne rien faire');});

// --- 3. le départ parfait
const dep=o=>base({etat:'compte',vitesse:0,depart:Object.assign({lance:null,resultat:null,extinction:null,t:5},o)});
t('3. parti « parfait » ou « bon » : réussie ; patinage, calé, faux départ : ratée avec sa raison ; pas parti TUTO_DEPART_ATTENTE s après l’extinction : ratée', ()=>{
  for(const r of ['parfait','bon']) v(jouer(TUTORIEL.creerSuivi('depart',C),[dep({}),dep({extinction:5,t:5.2,lance:5.2,resultat:r})])==='reussie',r);
  for(const r of ['patinage','cale','faux']){const su=TUTORIEL.creerSuivi('depart',C);v(jouer(su,[dep({}),dep({extinction:5,t:5.3,lance:5.3,resultat:r})])==='ratee'&&su.raison===r,r);}
  const su=TUTORIEL.creerSuivi('depart',C);v(jouer(su,[dep({extinction:5,t:5+R.TUTO_DEPART_ATTENTE*0.9}),dep({extinction:5,t:5+R.TUTO_DEPART_ATTENTE+0.1})])==='ratee'&&su.raison==='attente');
  v(jouer(TUTORIEL.creerSuivi('depart',C),pendant(dep({}),10))==='encours','les feux allumés : on attend');});

// --- 4. l'aspiration et le dépassement
t('4. devant l’IA depuis TUTO_DEVANT_DUREE s : réussie ; devant un instant puis repassé : pas encore ; la course finie sans dépassement : ratée', ()=>{
  v(jouer(TUTORIEL.creerSuivi('depassement',C),[...pendant(base(),5),...pendant(base({devant:true}),R.TUTO_DEVANT_DUREE+0.1)])==='reussie');
  const su=TUTORIEL.creerSuivi('depassement',C);v(jouer(su,[...pendant(base({devant:true}),R.TUTO_DEVANT_DUREE*0.5),...pendant(base(),1),...pendant(base({devant:true}),R.TUTO_DEVANT_DUREE*0.5)])==='encours');
  const r=TUTORIEL.creerSuivi('depassement',C);v(jouer(r,[...pendant(base(),5),base({etat:'finie'})])==='ratee'&&r.raison==='pasDevant');});
t('4. la mise en place : les IA (pas le joueur) prennent le rythme lent TUTO_IA_RYTHME dès qu’elles ont leur pilote ; les autres leçons n’ont rien à poser', ()=>{
  const J={plateau:{pilotes:[{humain:false,pilote:null},{humain:true,pilote:{rythme:1}}]}};v(TUTORIEL.preparer('depassement',J)===false,'sans pilote');
  J.plateau.pilotes[0].pilote={rythme:1};v(TUTORIEL.preparer('depassement',J)===true&&J.plateau.pilotes[0].pilote.rythme===R.TUTO_IA_RYTHME&&J.plateau.pilotes[1].pilote.rythme===1);
  v(R.TUTO_IA_RYTHME<1&&R.TUTO_IA_RYTHME>0.5);for(const id of IDS.filter(x=>x!=='depassement')) v(TUTORIEL.preparer(id,{})===true,id);});

// --- 5. l'arrêt au stand ; 6. la pluie et les pneus
t('5. un arrêt fini sans excès de vitesse : réussie ; un excès dans la voie : ratée (« vitesse ») ; la course finie sans arrêt : ratée', ()=>{
  v(jouer(TUTORIEL.creerSuivi('stand',C),[...pendant(base(),5),base({arretEnCours:true}),base({arrets:1})])==='reussie');
  const a=TUTORIEL.creerSuivi('stand',C);v(jouer(a,[base({arretEnCours:true,arrets:0}),base({arretEnCours:true})])==='encours','pendant l’arrêt');
  const b=TUTORIEL.creerSuivi('stand',C);v(jouer(b,[...pendant(base(),5),base({penalitesStands:5})])==='ratee'&&b.raison==='vitesse');
  const b2=TUTORIEL.creerSuivi('stand',C);v(jouer(b2,[...pendant(base(),5),base({excesStands:1})])==='ratee'&&b2.raison==='vitesse','le limiteur qui agit rate la leçon (tour 45a)');
  const c=TUTORIEL.creerSuivi('stand',C);v(jouer(c,[...pendant(base(),5),base({etat:'finie'})])==='ratee'&&c.raison==='pasArret');});
t('6. la pluie venue, un arrêt et des pneus pluie (ou intermédiaires) : réussie ; un arrêt avant la pluie ne compte pas ; reparti en slicks : ratée (« pneus »)', ()=>{
  const mouille={eau:R.TUTO_PLUIE_EAU+0.1};
  v(jouer(TUTORIEL.creerSuivi('pluie',C),[...pendant(base(),3),...pendant(base(mouille),3),base(Object.assign({arrets:1,pneus:'pluie'},mouille))])==='reussie');
  v(jouer(TUTORIEL.creerSuivi('pluie',C),[...pendant(base(mouille),3),base(Object.assign({arrets:1,pneus:'inter'},mouille))])==='reussie','intermédiaires');
  const a=TUTORIEL.creerSuivi('pluie',C);v(jouer(a,[...pendant(base(),3),base({arrets:1,pneus:'slick'}),...pendant(base({arrets:1}),3)])==='encours','arrêt avant la pluie');
  const b=TUTORIEL.creerSuivi('pluie',C);v(jouer(b,[...pendant(base(mouille),3),base(Object.assign({arrets:1,pneus:'slick'},mouille))])==='ratee'&&b.raison==='pneus');
  const c=TUTORIEL.creerSuivi('pluie',C);v(jouer(c,[...pendant(base(mouille),3),base({etat:'finie'})])==='ratee'&&c.raison==='pasArret');});

// --- 7. la visite
t('7. la visite : le garage puis l’aileron, de retour au paddock : réussie ; le paddock seul ne suffit pas ; jamais de temps limite ; les étapes de la consigne', ()=>{
  const e=x=>base({ecran:x,etat:null});const su=TUTORIEL.creerSuivi('visite',C);
  v(jouer(su,pendant(e('championnat'),R.TUTO_TEMPS_MAX+5))==='encours','temps limite');v(TUTORIEL.etapeVisite(su,'championnat')==='paddock');
  v(jouer(su,[e('garage')])==='encours'&&TUTORIEL.etapeVisite(su,'garage')==='garage');
  v(jouer(su,[e('aileron')])==='encours'&&TUTORIEL.etapeVisite(su,'aileron')==='aileron');
  v(jouer(su,[e('garage')])==='encours'&&TUTORIEL.etapeVisite(su,'garage')==='retour');
  v(jouer(su,[e('championnat')])==='reussie');});
// (tour 48b, décision du propriétaire du 2026-11-04) le drift caché (PNEU_DRIFT faux, le jeu) : le tutoriel revient à 7 leçons, la 8e n'est
// plus proposée (ni dans la liste, ni par « Leçon suivante », ni par son adresse) ; rallumé, elle revient
t('drift caché : 8 leçons (le drift, ni dans la liste, ni après les drapeaux, ni par son id) ; drift rallumé : les 9 reviennent', ()=>{
  const av=R.PNEU_DRIFT;R.PNEU_DRIFT=false;
  try{v(JSON.stringify(TUTORIEL.LECONS.map(l=>l.id))===JSON.stringify(IDS.slice(0,8))&&TUTORIEL.LECONS.every((l,i)=>l.numero===i+1),'caché : '+TUTORIEL.LECONS.map(l=>l.id));
    v(!TUTORIEL.PAR_ID.vivante&&TUTORIEL.suivante('drapeaux')===null&&TUTORIEL.suivante('pluie')==='visite','caché : PAR_ID, suivante');
    R.PNEU_DRIFT=true;v(JSON.stringify(TUTORIEL.LECONS.map(l=>l.id))===JSON.stringify(IDS)&&TUTORIEL.PAR_ID.vivante.numero===9&&TUTORIEL.suivante('drapeaux')==='vivante','rallumé');}
  finally{R.PNEU_DRIFT=av;}});
// --- 8. (tour 55, T20) les drapeaux et l'aileron : une IA garée sur l'herbe (la scène), drapeau jaune puis VSC, la passer sans pénalité ; puis l'aileron abîmé, réparé au stand
t('8. les drapeaux : l’adresse (une IA, un joueur, 3 tours) ; passer la voiture arrêtée sans pénalité puis l’arrêt qui répare : réussie ; une pénalité, la fin de la course sans l’avoir passée, un arrêt sans réparation, la fin sans arrêt, un excès au stand, rien : ratée ; TUTO_LECON_DRAPEAUX faux : la leçon disparaît', ()=>{
  v(/course=3/.test(TUTORIEL.PAR_ID.drapeaux.adresse)&&/ia=1&joueur=1/.test(TUTORIEL.PAR_ID.drapeaux.adresse),'adresse');
  const L2=C.longueur,b=o=>base(Object.assign({longueur:L2,penalites:0,degats:0},o)),arrete=500;
  const pose=su=>{su.arrete={s:arrete,penalites:0};return su;};
  // avant la scène, rien ne se passe ; la voiture arrêtée vue puis passée : phase « aileron » et l'aileron à abîmer (poser)
  let su=TUTORIEL.creerSuivi('drapeaux',C);v(su.phase==='jaune'&&jouer(su,pendant(b({s:100}),5))==='encours'&&su.phase==='jaune','la scène pas posée');
  pose(su);v(jouer(su,[b({s:arrete-150}),b({s:arrete-30}),b({s:arrete+5})])==='encours'&&su.phase==='jaune','pas encore passée (5 m)');
  v(jouer(su,[b({s:arrete+R.TUTO_DRAPEAUX_PASSE+3})])==='encours'&&su.phase==='aileron'&&su.poser===true,'passée : l’aileron');
  v(jouer(su,[b({s:arrete+100,degats:R.TUTO_DRAPEAUX_DEGATS,arrets:0})])==='encours','encore abîmé, pas d’arrêt');
  su.poser=false;v(jouer(su,[b({arrets:1,arretEnCours:true,degats:R.TUTO_DRAPEAUX_DEGATS}),b({arrets:1,degats:0})])==='reussie','l’arrêt répare : réussie');
  su=pose(TUTORIEL.creerSuivi('drapeaux',C));v(jouer(su,[b({s:arrete-100}),b({s:arrete-10}),b({s:arrete+40,penalites:5})])==='ratee'&&su.raison==='drapeau','pénalité sous drapeau : '+su.raison);
  su=pose(TUTORIEL.creerSuivi('drapeaux',C));v(jouer(su,[b({s:arrete-100}),b({etat:'finie',s:arrete-10})])==='ratee'&&su.raison==='pasPasse','course finie : '+su.raison);
  su=pose(TUTORIEL.creerSuivi('drapeaux',C));su.vu=true;jouer(su,[b({s:arrete+50})]);su.poser=false;v(jouer(su,[b({arrets:1,degats:0.2})])==='ratee'&&su.raison==='pasRepare','arrêt sans réparation : '+su.raison);
  su=pose(TUTORIEL.creerSuivi('drapeaux',C));su.phase='aileron';v(jouer(su,[b({etat:'finie'})])==='ratee'&&su.raison==='pasArret','fin sans arrêt : '+su.raison);
  su=pose(TUTORIEL.creerSuivi('drapeaux',C));su.phase='aileron';v(jouer(su,[b({penalitesStands:5})])==='ratee'&&su.raison==='vitesse','excès au stand : '+su.raison);
  su=TUTORIEL.creerSuivi('drapeaux',C);let r;for(let i=0;i<R.TUTO_TEMPS_MAX+2;i++) r=TUTORIEL.pas(su,b({s:0,vitesse:0}),1);v(r==='ratee'&&su.raison==='temps','rien : '+su.raison);
  const av=R.TUTO_LECON_DRAPEAUX;R.TUTO_LECON_DRAPEAUX=false;
  try{v(!TUTORIEL.PAR_ID.drapeaux&&!TUTORIEL.LECONS.some(l=>l.id==='drapeaux')&&TUTORIEL.LECONS.every((l,i)=>l.numero===i+1)&&TUTORIEL.suivante('visite')==='vivante','caché : '+TUTORIEL.LECONS.map(l=>l.id+l.numero));}finally{R.TUTO_LECON_DRAPEAUX=av;}});
t('8. la scène des drapeaux : à TUTO_DRAPEAUX_ARRET s après le GO, l’IA est garée sur l’herbe TUTO_DRAPEAUX_DISTANCE m devant le joueur, immobile ; passée, l’aileron du joueur est abîmé et l’IA repart ; hors de la leçon, rien ne bouge', ()=>{
  const T=construireCircuit(CIRCUITS.technique),jv=creerVoiture(T,100,0),iv=creerVoiture(T,50,0),ia={humain:false,pilote:{},v:iv},moi={humain:true,pilote:null,v:jv};
  const J={ecran:'course',joueur:jv,course:{penalites:0},plateau:{go:0,temps:R.TUTO_DRAPEAUX_ARRET-1,pilotes:[moi,ia]}};
  let su=TUTORIEL.creerSuivi('drapeaux',T);TUTORIEL.scene(su,J,T);v(!su.arrete&&iv.piste.s<200,'trop tôt');
  J.plateau.temps=R.TUTO_DRAPEAUX_ARRET+0.5;iv.u=20;TUTORIEL.scene(su,J,T);
  v(su.arrete&&Math.abs(su.arrete.s-(100+R.TUTO_DRAPEAUX_DISTANCE))<T.pas*2&&iv.u===0&&Math.abs(iv.piste.d)>T.largeur/2+R.MARGE_HERBE,'garée : '+JSON.stringify(su.arrete)+' d='+iv.piste.d);
  iv.u=7;TUTORIEL.scene(su,J,T);v(iv.u===0,'immobile');
  su.poser=true;TUTORIEL.scene(su,J,T);v(jv.degats===R.TUTO_DRAPEAUX_DEGATS&&su.libere===true,'l’aileron abîmé');iv.u=7;TUTORIEL.scene(su,J,T);v(iv.u===7,'l’IA repart');
  const w=creerVoiture(T,100,0),ia2={humain:false,pilote:{},v:creerVoiture(T,50,0)};const J2={ecran:'course',joueur:w,course:{penalites:0},plateau:{go:0,temps:30,pilotes:[{humain:true,pilote:null,v:w},ia2]}};
  const x0=ia2.v.x;TUTORIEL.scene(TUTORIEL.creerSuivi('conduite',T),J2,T);v(ia2.v.x===x0&&w.degats===0,'une autre leçon : rien');});
// --- 9. (tours 37j, 37l ; la règle du propriétaire du 2026-10-29) le drift, à l'épingle du technique : en pneus drift (la voiture vivante, tant que le pneu
// drift n'existe pas), faire glisser l'arrière (TUTO_DRIFT_ARRIERE pendant TUTO_DRIFT_TENUE s) sans herbe ni tête-à-queue ; puis le même virage

t('9. le drift : l’adresse (essai libre sur le technique, la voiture vivante) ; une glissade tenue puis le même virage en adhérant : réussie ; l’herbe, un tête-à-queue, pas de glissade, rien : ratée ; le pneu de chaque phase', ()=>{
  v(/course=0/.test(TUTORIEL.PAR_ID.vivante.adresse)&&/circuit=technique/.test(TUTORIEL.PAR_ID.vivante.adresse)&&/pneus=drift/.test(TUTORIEL.PAR_ID.vivante.adresse),'adresse');
  const T=construireCircuit(CIRCUITS.technique),z=TUTORIEL.zoneFreinage(T),L=T.longueur,b=o=>Object.assign(base({longueur:L}),o),dt=0.1;
  // un passage dans l'épingle : 40 images dedans, l'arrière à a (0 à 1) et son angle al, avec l'herbe ou non
  const passage=(su,a,al,herbe)=>{let r=TUTORIEL.pas(su,b({s:((z.debut-50)%L+L)%L}),dt);const lz=((z.fin-z.debut)%L+L)%L;
    for(let k=0;k<40&&r==='encours';k++) r=TUTORIEL.pas(su,b({s:(z.debut+lz*(k+0.5)/40)%L,arriere:a,alpha:al,herbe:!!herbe}),dt);
    if(r==='encours') r=TUTORIEL.pas(su,b({s:(z.fin+5)%L}),dt);return r;};
  let su=TUTORIEL.creerSuivi('vivante',T);v(su.zone&&su.zone.debut===z.debut&&TUTORIEL.pneu(su)==='drift','la zone de l’épingle, en drift');

  su=TUTORIEL.creerSuivi('vivante',T);v(passage(su,0.9,R.TUTO_TETE_A_QUEUE+0.1)==='ratee'&&su.raison==='teteAQueue','tête-à-queue : '+su.raison);
  su=TUTORIEL.creerSuivi('vivante',T);v(passage(su,0.9,0.4,true)==='ratee'&&su.raison==='sortie','l’herbe : '+su.raison);
  su=TUTORIEL.creerSuivi('vivante',T);for(let i=0;i<R.TUTO_ZONE_ESSAIS-1;i++) v(passage(su,0.2,0.1)==='encours','essai '+i);v(passage(su,0.2,0.1)==='ratee'&&su.raison==='pasGlisse','pas de glissade : '+su.raison);
  su=TUTORIEL.creerSuivi('vivante',T);let r;for(let i=0;i<R.TUTO_TEMPS_MAX+2;i++) r=TUTORIEL.pas(su,b({s:0,vitesse:0}),1);v(r==='ratee'&&su.raison==='temps','rien : '+su.raison);

  const w={typePneus:'slick'};su=TUTORIEL.creerSuivi('vivante',T);TUTORIEL.appliquerPneu(su,w);v(w.typePneus==='drift','drift');su.phase='adherant';TUTORIEL.appliquerPneu(su,w);v(w.typePneus==='slick','adhérant');
  w.typePneus='inter';v(TUTORIEL.appliquerPneu(TUTORIEL.creerSuivi('conduite',C),w)===null&&w.typePneus==='inter','autre leçon');});
// le drift joué par un pilote scripté (le robot d'essai) en voiture vivante sur le technique, 400 m avant l'épingle : il freine tard en tournant,

  const T=construireCircuit(CIRCUITS.technique),z=TUTORIEL.zoneFreinage(T),DT=1/120;let r='encours',su;
