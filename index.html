<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- le même texte que texte('nomDuJeu') (textes.js) ; jamais « F1 » ni « Formula 1 » : ce sont des marques -->
<title>Grand Prix Dynasty</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scene3d"></div>
<div id="ips" class="cache"></div>
<!-- l'affichage provisoire de la conduite (étape 2) -->
<div id="tableau"><span id="rapport">1</span><span id="vitesse">0</span> <span id="unite"></span></div>
<button id="boutonSon" tabindex="-1">🔊</button>
<div id="sauvegardePerdue" class="cache" role="status"></div>
<div id="horsPiste" class="cache"></div>
<div id="aide"></div>
<!-- le téléphone (tactile.js, tour 51k) : seulement sur un écran tactile, pendant la conduite ; des div, pas des boutons (la manette ne les choisit pas) -->
<div id="tactile" class="cache">
  <div id="tactileGauche" class="tactileBouton tactileDir">◀</div><div id="tactileDroite" class="tactileBouton tactileDir">▶</div>
  <div id="tactileFrein" class="tactileBouton"></div><div id="tactileGaz" class="tactileBouton"></div>
  <div id="tactileRemise" class="tactileBouton tactilePetit">↩</div><div id="tactilePause" class="tactileBouton tactilePetit">⏸</div>
</div>
<button id="tactileActiver" class="cache" tabindex="-1"></button>
<div id="tactilePortrait" class="cache"></div>

<!-- la course (étape 3) -->
<div id="retroviseur" class="cache"></div>   <!-- le cadre du rétroviseur (son image est dessinée par scene3d.js dans la 3D, dessous) -->
<div id="hudCourse" class="cache">
  <div id="hudTour"></div>
  <div id="hudChrono"></div>
  <div id="hudEcart" class="cache"></div>   <!-- l'écart en direct avec le fantôme (qualification) -->
  <div id="hudPrecedent" class="cache"></div>
  <div id="hudMeilleur"></div>
  <div id="hudSecteurs"><span id="hudS1" class="secteur"></span><span id="hudS2" class="secteur"></span><span id="hudS3" class="secteur"></span></div>
</div>
<!-- la tour de classement (en haut à droite) et le radar (en bas à gauche), pendant une course à plusieurs -->
<div id="classement" class="cache"><div id="classementPlace"></div><ol id="classementListe"></ol></div>
<div id="primeDecouverte" class="cache"><span id="primeTexte"></span><b id="primeGain"></b></div>   <!-- la découverte : la prime selon ta place, en direct (tour 52g) -->
<div id="placeGrand" class="cache"></div>   <!-- … et « P3 ! » à chaque place gagnée -->
<div id="cameraSuivie" class="cache"></div>   <!-- « Caméra : Nom » : le pilote suivi après l'arrivée (tour 45d) -->
<canvas id="radar" class="cache" width="170" height="170"></canvas>
<canvas id="minicarte" class="cache" width="180" height="130"></canvas>   <!-- la minicarte : le circuit entier et toutes les voitures (minicarte.js) -->
<div id="meteoHud" class="cache"><span id="meteoIcone"></span><span id="meteoEau"></span><span id="meteoBarre"><i id="meteoPlein"></i></span></div>   <!-- la météo (meteo3d.js) : l'icône et l'eau sur la piste ; cachée au sec -->
<div id="gouttes" class="cache"></div>   <!-- les gouttes sur la visière, en vue cockpit sous la pluie -->
<div id="pneusHud" class="cache"><span id="pneusTexte"><span id="pneusIcone"></span><span id="pneusMots"></span></span><span id="pneusBarre"><i id="pneusPlein"></i></span><span id="pneusAdherence"></span></div>   <!-- ?pneus=1 : l'usure et l'adhérence perdue -->
<div id="drapeau" class="cache" role="status"></div>   <!-- le drapeau du joueur (drapeaux.js) : jaune, bleu, VSC, vert -->
<div id="messageCourse" class="cache"></div>   <!-- les messages de course (messages.js), un à la fois -->
<div id="hudPenalite" class="cache"></div>
<div id="hudStand" class="cache"></div>   <!-- l'arrêt au stand (étape 7) : le tour conseillé, l'arrêt en cours, les pneus neufs -->
<div id="compte" class="cache"></div>
<div id="attenteArrivee" class="cache"><span id="attenteTexte"></span><button id="boutonPasser"></button></div>
<div id="feux" class="cache"><span></span><span></span><span></span><span></span><span></span></div>
<!-- le départ parfait (depart.js) : la jauge du régime de départ avec sa zone verte, au centre bas, puis le résultat -->
<div id="jauge" class="cache"><div id="jaugeBarre"><div id="jaugeVert"></div><div id="jaugeAiguille"></div></div><div id="jaugeAide"></div></div>
<div id="departResultat" class="cache"></div>
<!-- le mode 2 joueurs (deux-joueurs.js, écran partagé haut / bas) : l'affichage de chaque moitié (place, tour, vitesse, écart avec l'autre),
     les feux, la jauge et le résultat du départ du joueur 2 dans sa moitié (ceux du joueur 1 sont les éléments ci-dessus, déplacés par CSS) -->
<div id="deuxSeparation" class="cache"></div>
<div id="deuxHaut" class="deuxHud cache"><span class="deuxNom"></span><span class="deuxPlace"></span><span class="deuxTour"></span><span class="deuxVitesse"></span><span class="deuxEcart"></span></div>
<div id="deuxRappel1" class="deuxRappel cache"></div><div id="deuxRappel2" class="deuxRappel cache"></div>   <!-- le rappel des touches de chaque joueur (touches.js, tour 44d) -->
<div id="deuxBas" class="deuxHud cache"><span class="deuxNom"></span><span class="deuxPlace"></span><span class="deuxTour"></span><span class="deuxVitesse"></span><span class="deuxEcart"></span></div>
<div id="feux2" class="cache"><span></span><span></span><span></span><span></span><span></span></div>
<div id="jauge2" class="cache"><div id="jaugeBarre2"><div id="jaugeVert2"></div><div id="jaugeAiguille2"></div></div><div id="jaugeAide2"></div></div>
<div id="departResultat2" class="cache"></div>

<!-- le premier lancement (decouverte.js) : l'écran titre, « Entre amis » (bientôt), les aides de la découverte, « Prêt pour ta carrière ? » -->
<section id="titre" class="ecran cache">
  <h1 id="titreNom"></h1>
  <div class="boutons"><button id="boutonJouer" tabindex="-1"></button></div>
  <div class="boutons"><button id="boutonAmis" class="petit" tabindex="-1"></button></div>
  <div class="boutons" id="titreAide"><button id="boutonTutorielTitre" class="petit" tabindex="-1"></button><button id="boutonAidesTitre" class="petit" tabindex="-1"></button><button id="boutonTouchesTitre" class="petit" tabindex="-1"></button></div>   <!-- « Apprendre à piloter » (tutoriel.js, Codeur 4) : proposé, jamais imposé -->
</section>
<!-- « Entre amis » (titre et paddock) : le petit menu, puis l'écran avant la course à deux (deux-joueurs.js, tour 25b) -->
<section id="amis" class="ecran cache">
  <h1 id="amisTitre"></h1>
  <div class="boutons"><button id="boutonAmisDeux" tabindex="-1"></button><button id="boutonAmisTournoi" tabindex="-1"></button><button id="boutonAmisDefi" tabindex="-1"></button></div>   <!-- « Relever un défi » (defi.js, tour 49b) -->
  <div class="boutons"><button id="boutonAmisRetour" class="petit" tabindex="-1"></button></div>
</section>
<!-- les touches au choix (clavier.js, tour 49b) : chaque commande, un clic puis la touche voulue ; « Par défaut » remet tout -->
<section id="touches" class="ecran cache">
  <h1 id="touchesTitre"></h1>
  <p id="touchesMessage"></p>
  <div id="touchesGroupes"></div>
  <div class="boutons"><button id="boutonTouchesDefaut" class="petit" tabindex="-1"></button><button id="boutonTouchesRetour" tabindex="-1"></button></div>
</section>
<!-- le défi du fantôme entre amis (defi.js, tour 49b) : coller le code d'un ami, la liste des défis reçus ; puis la fin du tour -->
<section id="defi" class="ecran cache">
  <h1 id="defiTitre"></h1>
  <p id="defiExplication"></p>
  <input id="defiSaisie" type="text" autocomplete="off" spellcheck="false">
  <p id="defiMessage"></p>
  <div class="boutons"><button id="boutonDefiCourir" tabindex="-1"></button><button id="boutonDefiRetour" class="petit" tabindex="-1"></button></div>
  <ol id="defiListe"></ol>
</section>
<section id="defiFin" class="ecran cache">
  <h1 id="defiFinTitre"></h1>
  <p id="defiFinContre"></p>
  <p id="defiFinTexte"></p>
  <div id="defiFinCode" class="codeDefi cache"></div>
  <div class="boutons"><button id="boutonDefiRecommencer" tabindex="-1"></button><button id="boutonDefiRenvoyer" tabindex="-1"></button><button id="boutonDefiQuitter" class="petit" tabindex="-1"></button></div>
</section>
<section id="deuxReglages" class="ecran cache">
  <h1 id="deuxTitre"></h1>
  <div id="deuxJoueurs">
    <div class="deuxJoueur" id="deuxJoueur1"><h2></h2>
      <label><span class="deuxNomTexte"></span><input id="deuxNom1" type="text" maxlength="12" autocomplete="off" spellcheck="false"></label>
      <label><span class="deuxCouleurTexte"></span><span class="deuxCouleurs" id="deuxCouleurs1"></span></label>
      <label><span class="deuxCasqueTexte"></span><span class="deuxCasque"><span class="deuxIcone" id="deuxIcone1"></span><select id="deuxMotif1"></select><input id="deuxCasque1a" type="color"><input id="deuxCasque1b" type="color"><input id="deuxCasque1c" type="color"></span></label>
      <p class="deuxTouches"></p></div>
    <div class="deuxJoueur" id="deuxJoueur2"><h2></h2>
      <label><span class="deuxNomTexte"></span><input id="deuxNom2" type="text" maxlength="12" autocomplete="off" spellcheck="false"></label>
      <label><span class="deuxCouleurTexte"></span><span class="deuxCouleurs" id="deuxCouleurs2"></span></label>
      <label><span class="deuxCasqueTexte"></span><span class="deuxCasque"><span class="deuxIcone" id="deuxIcone2"></span><select id="deuxMotif2"></select><input id="deuxCasque2a" type="color"><input id="deuxCasque2b" type="color"><input id="deuxCasque2c" type="color"></span></label>
      <p class="deuxTouches"></p></div>
  </div>
  <div id="deuxCourse">
    <label><span id="deuxCircuitTexte"></span><select id="deuxCircuit"></select></label>
    <label><span id="deuxToursTexte"></span><select id="deuxTours"></select></label>
    <div id="deuxLongueur" class="cache"><span id="deuxLongueurTitre"></span><div id="deuxLongueurBoutons"></div></div>   <!-- 5, 12 ou 18 tours, comme sur la page Course (tour 54a) -->
    <label><span id="deuxIATexte"></span><select id="deuxIA"></select></label>
    <label><span id="deuxNiveauTexte"></span><select id="deuxNiveau"></select></label>
  </div>
  <p id="deuxErreur"></p>
  <div class="boutons"><button id="boutonDeuxPartir" tabindex="-1"></button><button id="boutonDeuxRetour" class="petit" tabindex="-1"></button></div>
</section>
<!-- le tournoi chrono entre copains (tournoi.js, tour 26b) : l'inscription, « À toi ! », la pause d'un tour, le classement de la manche, la fin -->
<section id="tournoiInscription" class="ecran cache" data-formule="tournoi">
  <h1 id="tournoiTitre"></h1>
  <ol id="tournoiListe"></ol>
  <div class="boutons"><button id="boutonTournoiAjouter" class="petit" tabindex="-1"></button></div>
  <div class="boutons" id="tournoiFormules"><button id="boutonFormuleEclair" tabindex="-1"></button><button id="boutonFormuleTournoi" tabindex="-1"></button></div>
  <div id="tournoiCircuits"><span id="tournoiCircuitsTexte"></span><select id="tournoiCircuit0"></select><select id="tournoiCircuit1"></select><select id="tournoiCircuit2"></select></div>
  <p id="tournoiErreur"></p>
  <div class="boutons"><button id="boutonTournoiPartir" tabindex="-1"></button><button id="boutonTournoiRetour" class="petit" tabindex="-1"></button></div>
</section>
<section id="tournoiAToi" class="ecran cache">
  <div id="atoiIcone"></div>
  <h1 id="atoiTitre"></h1>
  <p id="atoiManche"></p>
  <div id="atoiCompte"></div>
  <p id="atoiAide"></p>
</section>
<section id="tournoiPause" class="ecran cache">
  <h1 id="tournoiPauseTitre"></h1>
  <div class="boutons"><button id="boutonTournoiReprendre" tabindex="-1"></button><button id="boutonTournoiAbandon" tabindex="-1"></button></div>
</section>
<section id="tournoiManche" class="ecran cache">
  <h1 id="tournoiMancheTitre"></h1>
  <p id="tournoiPhrase"></p>
  <div id="tournoiTableaux">
    <ol id="tournoiMancheListe" class="tournoiTableau"></ol>
    <div id="tournoiGeneral" class="cache"><h2 id="tournoiGeneralTitre"></h2><ol id="tournoiGeneralListe" class="tournoiTableau"></ol></div>
  </div>
  <div class="boutons"><button id="boutonTournoiSuite" tabindex="-1"></button><button id="boutonTournoiDefi" class="cache" tabindex="-1"></button></div>
  <div id="tournoiCode" class="codeDefi cache"></div>   <!-- « 📋 Défier un ami » : le tour qui vient d'être fait (defi.js, tour 49b) -->
</section>
<section id="tournoiFin" class="ecran cache">
  <h1 id="tournoiFinTitre"></h1>
  <ol id="tournoiFinListe" class="tournoiTableau"></ol>
  <div class="boutons"><button id="boutonTournoiRejouer" tabindex="-1"></button><button id="boutonTournoiNouveaux" tabindex="-1"></button></div>
</section>
<div id="aides" class="cache"><span id="aideGaz"></span><span id="aideDirection"></span><span id="aideFrein"></span></div>

<!-- la création du pilote (pilote.js) : après « Prêt pour ta carrière ? », ou au chargement d'une sauvegarde sans pilote -->
<section id="pilote" class="ecran cache">
  <h1 id="piloteTitre"></h1>
  <!-- après la découverte (tour 52e) : trois pilotes prêts en grosses cartes, un clic = c'est parti ; « Personnaliser » ouvre le formulaire -->
  <div id="piloteRapide">
    <div id="piloteCartes"></div>
    <div class="boutons"><button id="boutonPilotePerso" class="petit" tabindex="-1"></button></div>
  </div>
  <div id="piloteChamps">
    <label><span id="piloteNomTexte"></span><input id="piloteNom" type="text" maxlength="12" autocomplete="off" spellcheck="false"></label>
    <label><span id="piloteNumeroTexte"></span><input id="piloteNumero" type="number" min="1" max="99"></label>
    <label><span id="pilotePaysTexte"></span><select id="pilotePays"></select></label>
    <label id="piloteCoeurLigne"><span id="piloteCoeurTexte"></span><select id="piloteCoeur"></select></label>
    <p id="piloteDomicile"></p>
  </div>
  <!-- le casque (casque.js) : le motif, les trois couleurs, et le casque qui tourne en 3D -->
  <div id="casqueEditeur">
    <canvas id="casqueApercu" width="160" height="160"></canvas>
    <div id="casqueChamps">
      <h2 id="casqueTitre"></h2>
      <label><span id="casqueMotifTexte"></span><select id="casqueMotif"></select></label>
      <label><span id="casqueCouleursTexte"></span><span class="couleurs"><input id="casqueC1" type="color"><input id="casqueC2" type="color"><input id="casqueC3" type="color"></span></label>
    </div>
  </div>
  <p id="piloteErreur"></p>
  <div class="boutons" id="piloteBoutons"><button id="boutonPiloteValider" tabindex="-1"></button></div>
</section>

<section id="choix" class="ecran cache">
  <h1 id="choixTitre"></h1>
  <div id="choixListe"></div>
  <div class="boutons"><button id="boutonAidesChoix" class="petit" tabindex="-1"></button></div>
</section>

<!-- la qualification du joueur, avant une course contre les IA : le choix, puis le résultat -->
<section id="qualif" class="ecran cache">
  <h1 id="qualifTitre"></h1>
  <p id="qualifTexte"></p>
  <p id="qualifFantome"></p>   <!-- après le tour : nouveau record, ou l'écart final avec le fantôme -->
  <div class="boutons"><button id="boutonQualifTour" tabindex="-1"></button><button id="boutonQualifPasser" tabindex="-1"></button><button id="boutonQualifCourse" tabindex="-1"></button><button id="boutonQualifDefi" tabindex="-1"></button></div>
  <div id="qualifCode" class="codeDefi cache"></div>   <!-- « 📋 Défier un ami » : le code du tour (defi.js, tour 49b) -->
  <div class="boutons"><button id="boutonFantomeQualif" class="boutonFantome" tabindex="-1"></button><button id="boutonFantomePole" class="boutonFantome cache" tabindex="-1"></button></div>
</section>

<!-- ?championnat=1 : l'écran entre les courses, le paddock (tour 48a, Codeur 1 ; le propriétaire 2026-11-04) : un menu à gauche, une page
     au centre. Les anciens boutons gardent leur id et sont rangés dans les pages (interface.js : pagePaddock) -->
<section id="championnat" class="ecran cache">
  <nav id="paddockMenu">
    <p id="paddockMarque"></p>
    <button id="menuCourse" class="menuEntree" data-page="course" tabindex="-1"><span class="menuIcone">🏁</span><span class="menuNom"></span></button>
    <button id="menuEquipe" class="menuEntree" data-page="equipe" tabindex="-1"><span class="menuIcone">🔧</span><span class="menuNom"></span></button>
    <button id="menuBoutique" class="menuEntree" data-page="boutique" tabindex="-1"><span class="menuIcone">🛒</span><span class="menuNom"></span></button>
    <button id="menuSaison" class="menuEntree" data-page="saison" tabindex="-1"><span class="menuIcone">📅</span><span class="menuNom"></span></button>
    <button id="menuMessages" class="menuEntree" data-page="messages" tabindex="-1"><span class="menuIcone">✉️</span><span class="menuNom"></span><span class="menuPoint cache">●</span></button>
    <button id="boutonAmisPaddock" class="menuEntree" tabindex="-1"><span class="menuIcone">👥</span><span class="menuNom"></span></button>   <!-- « Entre amis » : ouvre son menu (preparerAmis) -->
    <span class="menuEspace"></span>
    <button id="menuReglages" class="menuEntree" data-page="reglages" tabindex="-1"><span class="menuIcone">⚙</span><span class="menuNom"></span></button>
    <button id="boutonTutorielPaddock" class="menuEntree" tabindex="-1"><span class="menuIcone">?</span><span class="menuNom"></span></button>   <!-- « Apprendre » : la liste des leçons (tutoriel.js) -->
  </nav>
  <div id="paddockPages">
    <!-- Course (l'accueil) : le prochain Grand Prix, ta place et ton duel, le classement réduit, les messages, « Course suivante » -->
    <div id="pageCourse" class="paddockPage" data-page="course">
      <div id="paddockProchain" class="tvCarte">
        <p id="paddockSurtitre" class="tvSurtitre"></p>
        <h1 id="championnatTitre"></h1>
        <p id="prevision" class="cache"></p>   <!-- la météo prévue (meteo3d.js) -->
        <p id="paddockDomicile" class="cache"><span class="maison"></span> <span id="paddockDomicileTexte"></span></p>
        <p id="championnatGagne"></p>
        <canvas id="paddockCarte" width="330" height="170"></canvas>
      </div>
      <div id="paddockMoi" class="tvCarte">
        <p id="paddockPlace"></p>
        <p id="championnatDuel"></p>
      </div>
      <div id="paddockCourt" class="tvCarte"><h2 id="paddockCourtTitre"></h2><ol id="paddockClassementCourt"></ol><button id="boutonVoirTout" class="petit" tabindex="-1"></button></div>
      <div id="paddockNouvelles" class="tvCarte"><h2 id="paddockNouvellesTitre"></h2><p id="paddockNouvellesTexte"></p><button id="boutonVoirMessages" class="petit" tabindex="-1"></button></div>
      <div id="paddockLongueur" class="tvCarte cache"><h2 id="paddockLongueurTitre"></h2><div id="paddockLongueurBoutons"></div></div>   <!-- 5, 12 ou 18 tours (tour 53h) -->
      <button id="boutonCourseSuivante" tabindex="-1"></button>
    </div>
    <!-- Mon équipe : l'argent, le sponsor, la réputation ; le garage (et l'aileron), les sponsors, le casque -->
    <div id="pageEquipe" class="paddockPage cache" data-page="equipe">
      <h2 class="pageTitre" id="pageEquipeTitre"></h2>
      <div class="tvCarte pageInfos"><p id="championnatArgent"></p><p id="championnatSponsor"></p><div id="championnatReputation"></div></div>
      <div class="pageBoutons"><button id="boutonGarage" tabindex="-1"></button><button id="boutonMaVoiture" tabindex="-1"></button><button id="boutonSponsors" tabindex="-1"></button><button id="boutonMonCasque" tabindex="-1"></button></div>
    </div>
    <!-- Boutique : livrées, casques et célébrations ; « Ouvrir la boutique » ouvre l'écran de la boutique (boutique.js, tour 48c) -->
    <div id="pageBoutique" class="paddockPage cache" data-page="boutique">
      <h2 class="pageTitre" id="pageBoutiqueTitre"></h2>
      <div id="boutiqueContenu" class="tvCarte"><p id="boutiqueSoldePage"></p><p id="boutiqueBientot"></p><div class="pageBoutons"><button id="boutonBoutique" tabindex="-1"></button></div></div>
    </div>
    <!-- Saison : le calendrier, l'album, l'arbre ; les classements complets -->
    <div id="pageSaison" class="paddockPage cache" data-page="saison">
      <h2 class="pageTitre" id="pageSaisonTitre"></h2>
      <p id="saisonResume"></p>
      <div class="pageBoutons"><button id="boutonCalendrier" tabindex="-1"></button><button id="boutonAlbum" tabindex="-1"></button><button id="boutonArbre" tabindex="-1"></button></div>
      <div id="championnatTableaux" class="tvCarte">
        <div><h2 id="championnatPilotesTitre"></h2><ol id="championnatPilotes"></ol></div>
        <div><h2 id="championnatEcuriesTitre"></h2><ol id="championnatEcuries"></ol></div>
      </div>
    </div>
    <!-- Messages : le courrier, le coéquipier, la direction -->
    <div id="pageMessages" class="paddockPage cache" data-page="messages">
      <h2 class="pageTitre" id="pageMessagesTitre"></h2>
      <div id="paddockMessages" class="pageBoutons colonne"><button id="boutonCourrier" tabindex="-1"></button><button id="boutonParlerCoequipier" tabindex="-1"></button><button id="boutonParlerPatron" tabindex="-1"></button></div>
      <div id="paddockDefis" class="tvCarte cache"></div>   <!-- les défis reçus, avec « Relever » (le lien de défi, tour 50b) -->
    </div>
    <!-- Réglages : le son, les aides au pilotage, revoir les aides, la qualité ; « Nouvelle carrière » et « Nouvelle carrière à 0 » -->
